<!DOCTYPE html>
<html lang="en" class="other">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body class="other">
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="other">
        <section id="contact">
            <h2>Contact Me</h2>
            <form id="contact-form" onsubmit="sendEmail(event)">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name">
                <span id="name-error" class="error-message"></span>

                <label for="email">Your Email:</label>
                <input type="text" id="email" name="email">
                <span id="email-error" class="error-message"></span>

                <label for="message">Your Message:</label>
                <textarea id="message" name="message"></textarea>
                <span id="message-error" class="error-message"></span>

                <button type="submit">Send Message <i class="fas fa-envelope"></i></button>
            </form>
            <div id="popup-modal" class="modal">
                <div class="modal-content">
                    <span class="close-button">&times;</span>
                    <p>Message sent!</p>
                </div>
            </div>
            <div class="social-links">
                <a href="https://github.com/arule11" target="_blank"><i class="fab fa-github"></i>GitHub</a>
                <a href="https://www.linkedin.com/in/athena-mcneil-roberts-709a95211/" target="_blank"><i class="fab fa-linkedin"></i>LinkedIn</a>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Athena MR</p>
    </footer>
</body>
</html>
